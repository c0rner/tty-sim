[package]
name = "tty-sim"
version = "0.1.1"
edition = "2024"
description = "Synchronous terminal automation over a pseudo-terminal"
license = "Apache-2.0"

[dependencies]
argh = "0.1"
filedescriptor = "0.8"
granit-parser = "2.0"
nix = { version = "0.31", features = ["signal"] }
portable-pty = "0.9"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Pedantic lints that are too noisy — opt out explicitly
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
